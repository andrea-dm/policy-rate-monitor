[project]
name = "policy-rate-monitor"
version = "0.1.0"
description = "Monitor of central-bank policy rates."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Andrea Del Monaco", email = "***@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Add runtime dependencies with `uv add <pkg>`; deptry (pre-push) checks they match the imports.
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-core>=2.50.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ═══════════════════════════════════════════════════════════ LINTING & FORMATTING ═══ #

[tool.ruff]
target-version = "py312"
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "housekeeping/**/*.py",
    ".github/utils/**/*.py",
    "diagnostics/**/*.py",
]

[tool.ruff.lint]
# Preview mode is on ONLY to reach the three preview complexity rules selected
# below (PLR0914 / PLR0916 / PLR1702). They measure the local-state, boolean
# and *nesting* dimensions of complexity — the dimensions SonarSource's
# cognitive-complexity metric adds on top of cyclomatic, and which no stable
# ruff rule measures. `explicit-preview-rules` keeps every other preview rule
# off: a family selection like `PL`, `RUF` or `FURB` enables only its stable
# members, so a ruff upgrade cannot silently widen the gate. (Preview mode does
# still activate preview *behaviour* and preview *fixes* for already-stable
# rules — that is the one accepted side effect of this switch.)
preview = true
explicit-preview-rules = true

extend-select = [
    # ── Complexity gate ────────────────────────────────────────────────────
    # Ruff has no port of SonarSource S3776 (cognitive complexity) — no ruff
    # rule computes that metric. These six approximate it by scoring each
    # dimension S3776 aggregates; thresholds are in [tool.ruff.lint.mccabe]
    # and [tool.ruff.lint.pylint] below. SonarLint (sonar-project.properties)
    # remains the only source of the real S3776 number.
    "C90", # mccabe cyclomatic complexity (C901) — Sonar S1541
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0914", # too many local variables [preview]
    "PLR0915", # too many statements — Sonar S138
    "PLR0916", # too many boolean expressions [preview] — Sonar S1067
    "PLR1702", # too many nested blocks [preview] — Sonar S134 (the single
    #            biggest cognitive-vs-cyclomatic divergence: Sonar charges a
    #            rising penalty per nesting level, mccabe charges nothing)

    # ── Families already enforced ──────────────────────────────────────────
    "A", # flake8-builtins — Sonar S5806 (builtin shadowing)
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "FA", # flake8-future-annotations
    "I", # flake8-import-order
    "PIE", # flake8-pie
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify — Sonar S1721/S1862 (duplicated branches/conditions)
    "TD", # flake8-todos (NOT flake8-type-checking — the previous comment here
    #       mislabelled it, so the TYPE_CHECKING contract in CLAUDE.md was
    #       never actually enforced. `TC` below closes that gap.)
    "E", # pycodestyle
    "F", # pyflakes — Sonar S1128/S1481 (unused imports and locals)
    "D1", # pydocstyle - undocumented public modules, classes, functions, methods
    "PL", # pylint
    "RUF", # ruff-specific rules

    # ── SonarLint parity ───────────────────────────────────────────────────
    # Families widened to cover the Sonar rules ruff can actually decide
    # statically. Deliberate house-style violations these drag in are carved
    # back out in `ignore` / `per-file-ignores` rather than left unselected,
    # so the exemption is visible instead of implicit.
    "ARG", # unused arguments — Sonar S1172
    "ASYNC", # blocking calls in async scope
    "DTZ", # naive datetimes (supersedes the DTZ005/DTZ007 singletons)
    "ERA", # commented-out code — Sonar S125
    "FURB", # refurb — Sonar's "code smell" modernisation family
    "G", # logging-format misuse (supersedes G201) — Sonar S2629
    "ISC", # implicit string concatenation (supersedes ISC004)
    "LOG", # logging API misuse
    "N", # pep8-naming — Sonar S101 (class), S1542 (function), S117 (local)
    "PERF", # perflint — Sonar performance smells
    "PGH", # blanket `# noqa` / `# type: ignore` — suppression hygiene
    "RSE", # raise-statement hygiene
    "S", # flake8-bandit — Sonar security hotspots (S2068 hardcoded creds,
    #      S2245 weak PRNG, S4830 disabled TLS verification, S4426 weak hashes,
    #      S5443 insecure temp paths, S5659 unsafe deserialisation)
    "SLF", # private-member access — Sonar S3011
    "T20", # stray print()/pprint() in library code
    "TC", # flake8-type-checking — enforces the "TYPE_CHECKING blocks for heavy
    #      imports, critical for CLI responsiveness" rule in CLAUDE.md
    "TRY", # tryceratops (supersedes TRY004/TRY401) — Sonar exception rules
    "UP", # pyupgrade (supersedes UP040)

    # ── Individually-selected singletons ───────────────────────────────────
    # Kept rule-by-rule because their families carry rules this codebase
    # deliberately violates.
    "BLE001", # blind `except Exception` — must carry a written justification

    # ── Re-pinned by exact code ────────────────────────────────────────────
    # Every rule below is already inside a family selected above, so these
    # entries look redundant. They are not, and MUST NOT be collapsed into the
    # family: `explicit-preview-rules = true` means a family selector enables
    # only that family's STABLE members. Any of these that is (or later
    # becomes) a preview rule would be silently switched off by a bare family
    # selection — a gate quietly weakening with no diff and no error. Naming
    # the code keeps it enabled either way, and pins it against a future ruff
    # release reshuffling it into preview.
    "DTZ005", # `datetime.now()` without tz
    "DTZ007", # naive `strptime()` without %z
    "G201", # `.error(..., exc_info=True)` → `.exception(...)`
    "ISC004", # unparenthesized implicit string concat in a collection
    "S110", # `try`-`except`-`pass`
    "S112", # `try`-`except`-`continue`
    "TRY004", # prefer `TypeError` for invalid type
    "TRY401", # redundant exception object in `logging.exception`
    "UP040", # `TypeAlias` annotation → `type` keyword
]

ignore = [
    "RUF100", # Unused `noqa` directive — tolerated: a directive can be load-
    #           bearing under a different ruff version or a narrower CLI run.
    # TC006 quotes the type expression in every `typing.cast()`. Its auto-fix
    # is in direct conflict with Sonar S1192: quoting turns repeated cast
    # types ("dict[str, Any]", "JsonDict") back into duplicated string
    # literals. The runtime cost of evaluating an unquoted alias in cast()
    # is a module-attribute lookup — negligible — so S1192 wins.
    "TC006", # runtime-cast-value — conflicts with Sonar S1192 (see above)
    # RUF102 (invalid rule code in `# noqa`) is deliberately NOT ignored. It is
    # not the same kind of rule as RUF100: an unparseable rule code is always a
    # typo, never intentional, so suppressing it only hides broken directives.
    # It was ignored here, and that is exactly why
    # `# noqa: hardcoded-sql-expression` in retriever.py sat there silently
    # suppressing nothing — ruff had no way left to report it.
    # The repo lives on an Azure ML fuse mount that pins every file to 0777, so
    # the exec bit carries no intent here and `chmod -x` is a silent no-op.
    "ERA001", # commented-out code — tests are allowed to comment out fixtures
    "EXE002", # Executable file without shebang

    # ── Carve-outs from the families widened above ─────────────────────────
    # Each of these is a documented house style. They were previously avoided
    # by simply not selecting the family; now the family is on and the
    # exemption is explicit.
    "TRY003", # long message outside the exception class — the
    #           `raise ValueError("literal")` style is used throughout
    "TRY400", # `logging.error` inside `except` — TRY401/G201 already govern
    #           the cases that matter; this one fights the deliberate
    #           error-vs-exception level split in the project's error logging
    # Dev-tool subprocess runners (housekeeping/, .github/utils/) call audited argv lists.
    "S603", # `subprocess` call without shell=True
    "S607", # partial executable path (git, bash)
    "ISC001", # single-line implicit concat — conflicts with `ruff format`
    "N802", # function name should be lowercase — conflicts with `pytest.mark.parametrize`
    "N806", # non-lowercase variable in function (was written as the rule NAME
    #         `non-lowercase-variable-in-function`, which is not a valid ruff
    #         selector and made the whole config fail to parse)
    "N812", # lowercase imported as non-lowercase (same — was
    #         `lowercase-imported-as-non-lowercase`)
    "T201", # stray `print()` in a test — tests are allowed to print
]


[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-bool-expr = 5 # PLR0916
max-branches = 12 # PLR0912
max-locals = 15 # PLR0914
max-nested-blocks = 4 # PLR1702
max-returns = 6 # PLR0911
max-statements = 50 # PLR0915

[tool.ruff.lint.flake8-type-checking]
# Annotations on these are resolved at RUNTIME; hoisting their imports into a
# TYPE_CHECKING block would break model construction.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "typing.TypedDict",
    "typing_extensions.TypedDict",
]
runtime-evaluated-decorators = ["pydantic.validate_call", "pydantic.dataclasses.dataclass"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG", # @patch mocks and unused pytest fixtures arrive as dead parameters
    "D1",
    "PLR0913",
    "PLR0914",
    "PLR0917",
    "PLR2004",
    "S101", # `assert` IS the test API
    "S105",
    "S106",
    "S107",
    "S108",
    "S311",
    "SLF001",
    "T20",
    "TC",
]
"housekeeping/**" = [
    "E402",
    "I001",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0916",
    "PLR0917",
    "PLR1702",
    "PLR2004",
    "S101",
    "SLF001",
    "T20",
]
"diagnostics/**" = [
    "T20", # spikes and benchmarks report their findings with print()
]
".github/utils/**" = [
    "E402",
    "I001",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0916",
    "PLR0917",
    "PLR1702",
    "PLR2004",
    "S101",
    "SLF001",
    "T20",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# Pyright is configured in pyrightconfig.json (the single source of truth).
# Do NOT add a [tool.pyright] block here: pyright ignores it when that file exists.

[tool.deptry]
known_first_party = ["policy_rate_monitor"]

[tool.deptry.per_rule_ignores]
# TEMPORARY: runtime deps declared ahead of the code that imports them. Remove each entry as
# soon as src/ imports it (pandas: M2 transform; matplotlib: M4 report).
DEP002 = ["pandas", "matplotlib"]

# ══════════════════════════════════════════════════════════════════════ UV CONFIG ═══ #

[tool.uv]
environments = ["sys_platform == 'linux'"]

[dependency-groups]
lint = [
    "deptry",
    "pandas-stubs>=3.1.0.261029",
    "pyright[nodejs]>=1.1.410",
    "ruff>=0.15.4",
    "tach>=0.34.1",
]

test = [
    "pytest>=9.0.3",
    "pytest-mock>=3.14",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.100",
]

dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

jupyter = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.5",
]

docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.28",
    "griffe>=1.0",
]

# ════════════════════════════════════════════════════════════════════════ Testing ═══ #

[tool.pytest.ini_options]
# Doctests: the `>>>` examples in docstrings under src/ run with the suite. Collection
# imports every module under src/, so a module must have no import-time side effects
# and every import it makes must be installed (else the whole run stops); see
# tests/conftest.py, which also marks doctests `unit`.
testpaths = ["tests", "src"]
pythonpath = ["."]
addopts = ["--doctest-modules"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "unit: Quick tests, no I/O, no external dependencies.",
    "contract: Tests at a boundary, using local stand-ins (temp files, mocked APIs or DBs).",
    "integration: Tests that talk to real external services (requires network, creds).",
    "whitebox: Tests that inspect internal state or mock internals (use sparingly).",
    "slow: Tests that take a long time to run.",
]

[tool.coverage.run]
# SQLite cannot lock on this CIFS mount — keep the data file on local disk.
data_file = "/tmp/cov/.coverage"
omit = ["*/__main__.py"]
