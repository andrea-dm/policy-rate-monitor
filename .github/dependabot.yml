version: 2
updates:
  # Actions only. Python dependency *security* updates come from the repo
  # setting (Settings -> Code security -> Dependabot security updates); version
  # bumps stay a deliberate, manual act.
  - package-ecosystem: github-actions
    # The composite action pins setup-uv too, so it is scanned with the workflows.
    directories:
      - /
      - /.github/actions/*
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
