name: CI

"on":
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PY_VERSION: "3.12"

jobs:
  lint:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ruff
            command: |
              uv run ruff format --check
              uv run ruff check --output-format github src/ tests/
          - name: deptry
            command: uv run deptry src/ tests/
          - name: tach
            command: uv run tach check
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.PY_VERSION }}
          enable-cache: true
          cache-suffix: lint
      - name: Install lint dependencies
        run: uv sync --locked --only-group lint --no-install-project
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.PY_VERSION }}
          enable-cache: true
          cache-suffix: pyright
      - name: Install dependencies
        run: uv sync --locked --group dev
      - run: uv run pyright src/ tests/

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.PY_VERSION }}
          enable-cache: true
          cache-suffix: pytest
      - name: Install dependencies
        run: uv sync --locked --group dev
      - run: uv run pytest tests/ --cov=src/policy_rate_monitor --cov-report=term-missing:skip-covered
