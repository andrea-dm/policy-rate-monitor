default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: \.tsv$  # a trailing tab is an empty last column, not whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: fix-byte-order-marker
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: ^mkdocs\.yml$  # !!python/name tags; mkdocs build validates it
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright (pre-push)
        entry: uv run --no-sync pyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: deptry
        name: deptry (pre-push)
        entry: uv run --no-sync deptry src/ tests/
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: tach-check
        name: tach check (pre-push)
        entry: uv run --no-sync tach check
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
