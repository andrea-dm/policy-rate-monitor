default_install_hook_types: [pre-commit, pre-push]
# The checks run in a fixed order and stop at the first failure: the module layering first,
# since a wrong import changes the code anyway; then ruff; at push, deptry and the slow pyright.
# README.md (Development Workflow) and CI use the same order.
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: tach-check
        name: tach check
        entry: uv run --no-sync tach check
        language: system
        always_run: true
        pass_filenames: false
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        # A trailing tab is an empty last column, not whitespace. report.html carries
        # Plotly's own code, which the hook must not change.
        exclude: \.tsv$|^out/report\.html$
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: fix-byte-order-marker
      - id: check-added-large-files
        args: ["--maxkb=2000"]
        # Plotly's JavaScript is inline in report.html so the page works offline: 5-7 MB.
        exclude: ^out/report\.html$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: ^mkdocs\.yml$  # !!python/name tags; mkdocs build validates it
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
      - id: deptry
        name: deptry (pre-push)
        entry: uv run --no-sync deptry src/ tests/
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: pyright
        name: pyright (pre-push)
        entry: uv run --no-sync pyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
