site_name: policy-rate-monitor
docs_dir: docs
theme:
  name: material
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Configuration: configuration.md
  - Milestones: milestones.md
  - Decisions:
      - adr/index.md
      - adr/0005-data-stack-pyarrow.md
      - adr/0006-exact-decimal-rates.md
      - adr/0007-twelve-month-look-back.md
      - adr/0008-fast-analytics-numpy-numba.md
