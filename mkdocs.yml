site_name: policy-rate-monitor
repo_url: https://github.com/andrea-dm/policy-rate-monitor
docs_dir: docs
theme:
  name: material
plugins:
  - search
  # OFFLINE=true builds a site that opens from the disk (file://), for the copy attached to
  # each GitHub release.
  - offline:
      enabled: !ENV [OFFLINE, false]
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
# A missing anchor is only INFO by default; warn makes --strict fail on it.
validation:
  anchors: warn
nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Architecture: architecture.md
  - Data model: data-model.md
  - Data quality: data-quality.md
  - CLI reference: cli.md
  - HTTP API: api.md
  - Configuration: configuration.md
  - API reference: reference.md
  - Glossary: glossary.md
  - Milestones: milestones.md
  - Advanced:
      - Overview: advanced/index.md
      - Implementation design:
          - advanced/implementation_design/index.md
          - advanced/implementation_design/system_overview.md
          - advanced/implementation_design/components.md
