# Tach — module boundaries. Layering (top -> bottom): higher layers may import
# lower; lower MUST NOT import higher. `core` is the foundation (no internal
# deps); `config` sits directly above it. Add a [[modules]] entry per new
# top-level subpackage of `policy_rate_monitor`.
#
# Run: uv run tach check

source_roots = ["src"]
exclude = ["tests", "notebooks", "**/__pycache__"]

[[modules]]
path = "policy_rate_monitor.config"
depends_on = ["policy_rate_monitor.core"]

[[modules]]
path = "policy_rate_monitor.core"
depends_on = []

[[modules]]
path = "policy_rate_monitor.fetch"
depends_on = ["policy_rate_monitor.config", "policy_rate_monitor.core"]

[[modules]]
path = "policy_rate_monitor.transform"
depends_on = ["policy_rate_monitor.config", "policy_rate_monitor.core", "policy_rate_monitor.fetch"]

[[modules]]
path = "policy_rate_monitor.analytics"
depends_on = ["policy_rate_monitor.config", "policy_rate_monitor.core"]

[[modules]]
path = "policy_rate_monitor.snapshot"
depends_on = ["policy_rate_monitor.analytics", "policy_rate_monitor.config", "policy_rate_monitor.core"]

# report imports charts only when Plotly is installed, for report.html.
[[modules]]
path = "policy_rate_monitor.report"
depends_on = ["policy_rate_monitor.charts", "policy_rate_monitor.config", "policy_rate_monitor.core"]

[[modules]]
path = "policy_rate_monitor.providers"
depends_on = ["policy_rate_monitor.config", "policy_rate_monitor.core"]

[[modules]]
path = "policy_rate_monitor.bulk"
depends_on = [
    "policy_rate_monitor.config",
    "policy_rate_monitor.core",
    "policy_rate_monitor.fetch",
    "policy_rate_monitor.providers",
    "policy_rate_monitor.transform",
]

[[modules]]
path = "policy_rate_monitor.settings"
depends_on = ["policy_rate_monitor.config"]

[[modules]]
path = "policy_rate_monitor.service"
depends_on = [
    "policy_rate_monitor.config",
    "policy_rate_monitor.core",
    "policy_rate_monitor.providers",
    "policy_rate_monitor.report",
    "policy_rate_monitor.snapshot",
]

# Needs the interactive extra (Plotly).
[[modules]]
path = "policy_rate_monitor.charts"
depends_on = ["policy_rate_monitor.core", "policy_rate_monitor.report"]

# Needs the web extra (FastAPI, uvicorn). An adapter beside cli, over the same service.
[[modules]]
path = "policy_rate_monitor.web"
depends_on = [
    "policy_rate_monitor.charts",
    "policy_rate_monitor.config",
    "policy_rate_monitor.core",
    "policy_rate_monitor.providers",
    "policy_rate_monitor.report",
    "policy_rate_monitor.service",
]

# cli imports web only inside `serve`, so the base install never loads it.
[[modules]]
path = "policy_rate_monitor.cli"
depends_on = [
    "policy_rate_monitor.bulk",
    "policy_rate_monitor.config",
    "policy_rate_monitor.core",
    "policy_rate_monitor.service",
    "policy_rate_monitor.settings",
    "policy_rate_monitor.web",
]
